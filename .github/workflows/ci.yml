name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The type generator reads the names of the secrets from .dev.vars. The example file has all names and no values.
      - run: cp .dev.vars.example .dev.vars
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Fails on a high or critical advisory in a package that ships. Advisories in development tools are listed in the audit report.
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the scan reads the whole history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
